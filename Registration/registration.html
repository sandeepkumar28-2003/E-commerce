<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./registration.css">
</head>
<body>
      <main>
        <div id="container">
          <h2>Create Account</h2>
          <p>Please fill in your details to register</p><br>
          <form id="formContainer">
            <label for="name">Full Name</label><br>
            <input type="text" id="name" placeholder="Anish Ravi"><br>
            <label for="email">Email Address</label><br>
            <input type="email" id="email" placeholder="anish@gmail.com"><br>
            <label for="password">Password</label><br>
            <input type="password" id="password" placeholder="*********"><br>
            <label for="mobile">Mobile Number</label><br>
            <input type="tel" id="mobile" placeholder="+91 123 456 7890"><br><br>
            <button type="submit">Register</button>
          </form>
          <center>
            <p>Already have an account? <a href="">SignIn</a></p>
            <p id="copy-right">&copy;2026 Your Company. All rights reserved</p>
          </center>
        </div>
      </main> 

      <script src="./registration.js"></script>
</body>
</html>
